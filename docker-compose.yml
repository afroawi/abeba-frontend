name: abeba-frontend
services:
  frontend:
    build: .
    restart: unless-stopped
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-18150}:8080"
    environment:
      ABEBA_API_UPSTREAM: ${ABEBA_API_UPSTREAM:-http://host.docker.internal:8000}
    extra_hosts:
      - host.docker.internal:host-gateway
    security_opt:
      - no-new-privileges:true
