# Append this server block alongside your existing backend server blocks in
# /etc/nginx/sites-available/default. Do not paste inside another server block.
# Issue/attach TLS certificates after DNS points this hostname to your server.
server {
    listen 80;
    server_name web.abebachat.com;
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:18150;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
